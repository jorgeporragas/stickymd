[package]
name = "stickymd"
version = "1.0.2"
description = "A markdown scratchpad."
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the application is tray-resident, so closing the last note
# window puts it away rather than ending it. See src-tauri/src/tray.rs.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Deletion goes to the platform's trash, never an unlink: a note the user
# deleted by mistake must be recoverable. See CLAUDE.md, cross-platform.
trash = "5"

# Global shortcuts are registered with the OS, not the web view - the only
# place a chord survives both browser accelerators and AltGr. See docs/FIXES.md.
tauri-plugin-global-shortcut = "2"

# The folder picker in the settings window. A native dialog rather than a text
# field: a notes folder typed by hand is a notes folder that can be wrong.
tauri-plugin-dialog = "2"

# Launch at startup, off unless the user turns it on. MASTER veto 5 forbids
# enabling it without explicit consent, so nothing here ever calls enable()
# except the tray toggle.
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

# Compositor blur. The frosted surface is a window property applied here, not a
# CSS filter -- a web view cannot see the desktop behind it.
# See docs/DESIGN.md principle 3.
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"

# Rounding the window itself, not just the surface painted inside it. The
# compositor backdrop fills the whole square window, so a CSS radius alone
# leaves the corners showing raw acrylic. See docs/FIXES.md.
# Win32_System_Registry is for the transparency setting: it lives in the
# registry and the only way to hear it change is to watch the key. No new
# crate for it -- this dependency is already here for the corner rounding.
windows = { version = "0.56", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Registry",
] }

# Bundle size is a stated product priority. See MASTER.md section 'Stack'.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
