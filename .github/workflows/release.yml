# Builds a release from a v* tag and attaches both assets to it.
#
# Nothing here builds a distributable on a developer's machine — that is a
# CLAUDE.md imperative, and the reason is that a build from a laptop carries
# whatever that laptop happened to have installed. This starts from a clean
# runner and a known commit.
#
# The only actions used are GitHub's own, and the release itself is created
# through the `gh` CLI that ships on the runner. A third-party action here would
# be a supply-chain dependency in the one workflow whose output people download
# and execute.

name: Release

on:
  push:
    tags:
      - 'v*'

# The workflow only ever writes releases. Nothing else needs a token.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # A tag whose version does not match the manifests produces an installer
      # named after the wrong version, which is only ever noticed after it has
      # been downloaded. Fail here instead.
      - name: Check the tag against the manifests
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag $tag | tauri.conf.json $tauri | package.json $npm"
          if ($tauri -ne $tag -or $npm -ne $tag) {
            throw "Version mismatch: the tag says $tag, tauri.conf.json says $tauri, package.json says $npm."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Install dependencies
        run: npm ci

      # The Rust tests carry the path and name validation. A release that has
      # not run them is a release that has not checked the one piece of this
      # application that handles untrusted input.
      - name: Test
        working-directory: src-tauri
        run: cargo test

      # The signing key is the updater's whole trust model: the manifest and the
      # installer are signed here, and the application refuses anything that
      # does not verify against the public key compiled into it. Absent the
      # secret, the build still succeeds and simply produces no signatures —
      # which is the honest behaviour for a fork that has its own key or none.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # Tauri builds the installer. The portable asset is the same binary with
      # no installer around it — extract and run, nothing written to the
      # registry, no administrator rights. The licence travels with it: GPL-3.0
      # requires the terms to be conveyed alongside the binary, and a zip
      # someone extracts on its own is exactly the case that would otherwise
      # arrive without them.
      - name: Assemble the portable zip
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $staging = "portable/sticky.md-$version"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item src-tauri/target/release/stickymd.exe $staging
          Copy-Item LICENSE $staging
          Copy-Item README.md $staging
          Compress-Archive -Path $staging -DestinationPath "portable/sticky.md-$version-portable-x64.zip"

      # The updater asks for one file and reads the rest from it. Written here
      # rather than by a third-party action, for the same reason nothing else
      # in this workflow is one: it is the file that tells every installed copy
      # what to download next.
      #
      # Skipped when there is no signature, because a manifest the updater
      # cannot verify is worse than no manifest — it turns every update check
      # into an error instead of a quiet "you are up to date".
      - name: Write the update manifest
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $installer = Get-ChildItem -Recurse -Include *.exe -Path src-tauri/target/release/bundle/nsis | Select-Object -First 1
          $signature = "$($installer.FullName).sig"

          if (-not (Test-Path $signature)) {
            "No signature beside $($installer.Name) — the signing key is not set, so no manifest is written."
            exit 0
          }

          $manifest = [ordered]@{
            version   = $version
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            notes     = "See the release notes for $version."
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $signature -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
              }
            }
          }

          New-Item -ItemType Directory -Path manifest -Force | Out-Null
          $manifest | ConvertTo-Json -Depth 5 | Set-Content manifest/latest.json -Encoding utf8
          Get-Content manifest/latest.json

      # Created as a draft: MASTER.md says every release carries written notes,
      # and notes nobody wrote are not written notes. The assets are attached
      # and the release waits for the founder to describe it and publish.
      - name: Attach the assets to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(Get-ChildItem -Recurse -Include *.exe -Path src-tauri/target/release/bundle/nsis | ForEach-Object { $_.FullName })
          $assets += (Get-ChildItem portable/*.zip | ForEach-Object { $_.FullName })
          if (Test-Path manifest/latest.json) { $assets += (Resolve-Path manifest/latest.json).Path }
          $assets

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --notes "Draft. Release notes go here before publishing."
          }
          gh release upload $tag $assets --clobber

  # macOS runs after Windows rather than beside it, for one reason: both jobs
  # write to the same release and the same `latest.json`, and two jobs creating
  # one draft is a race with a silent loser. By the time this starts, the draft
  # exists and the manifest has its Windows half.
  #
  # Apple Silicon only, at the founder's decision. A universal binary doubles
  # the build for a second architecture he does not have and cannot test.
  macos:
    needs: windows
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc --version

      - name: Install dependencies
        run: npm ci

      # The same tests the Windows job runs. They cover path and name
      # validation, which is the code that handles untrusted input, and it is
      # worth knowing they pass on a platform whose path rules differ.
      - name: Test
        working-directory: src-tauri
        run: cargo test

      # Two kinds of signing are in play here and they are unrelated.
      #
      # APPLE_* is Apple's: it signs the .app with a Developer ID certificate
      # and notarises it, which is what stops Gatekeeper refusing to open a
      # downloaded application. TAURI_SIGNING_* is the updater's minisign key,
      # the same one the Windows job uses, and it signs the update artefact so
      # an installed copy can verify what it is about to install.
      #
      # Absent either, the build still succeeds and simply produces less: no
      # notarisation, or no signature to put in the manifest.
      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin

      # Merged into the manifest rather than written over it. `latest.json` is
      # one file describing every platform, and the Windows job has already put
      # its own entry in — fetching, adding and re-uploading is what keeps both.
      - name: Add macOS to the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="src-tauri/target/aarch64-apple-darwin/release/bundle"

          archive=$(find "$out/macos" -name '*.app.tar.gz' | head -1)
          signature="${archive}.sig"

          if [ ! -f "$signature" ]; then
            echo "No signature beside the archive — the updater key is not set, so macOS is left out of the manifest."
            exit 0
          fi

          gh release download "$GITHUB_REF_NAME" --pattern latest.json --clobber || true

          python3 - "$version" "$archive" "$signature" <<'PY'
          import json, os, pathlib, sys

          version, archive, signature = sys.argv[1], sys.argv[2], sys.argv[3]
          path = pathlib.Path('latest.json')

          # The Windows half if it is there, a fresh manifest if it is not. A
          # macOS-only release is not a thing this project ships, but a manifest
          # that silently dropped Windows would be far worse than one written
          # from scratch.
          manifest = json.loads(path.read_text()) if path.exists() else {
              'version': version,
              'pub_date': None,
              'notes': f'See the release notes for {version}.',
              'platforms': {},
          }

          manifest['platforms']['darwin-aarch64'] = {
              'signature': pathlib.Path(signature).read_text().strip(),
              'url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
                     f"{os.environ['GITHUB_REF_NAME']}/{pathlib.Path(archive).name}",
          }

          path.write_text(json.dumps(manifest, indent=2))
          print(path.read_text())
          PY

          gh release upload "$GITHUB_REF_NAME" latest.json --clobber

      - name: Attach the macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="src-tauri/target/aarch64-apple-darwin/release/bundle"

          assets=()
          while IFS= read -r f; do assets+=("$f"); done < <(find "$out/dmg" -name '*.dmg' 2>/dev/null || true)
          while IFS= read -r f; do assets+=("$f"); done < <(find "$out/macos" -name '*.app.tar.gz' 2>/dev/null || true)

          for asset in "${assets[@]}"; do echo "$asset"; done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
